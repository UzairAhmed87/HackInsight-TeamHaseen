name: Hourly Data Pipeline

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: hourly-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      # Optional: set both secrets to also record runs in a Prefect Cloud workspace.
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Restore immutable raw source files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ hashFiles('config/*.json') }}-${{ github.run_id }}
          restore-keys: raw-${{ hashFiles('config/*.json') }}-

      - name: Install orchestration dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Run Prefect flow
        id: flow
        run: python prefect_flow.py
        continue-on-error: true

      - name: Commit run log and refreshed artifacts
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prefect_runs.csv data/processed data/quality/quality_report.json data/reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Hourly pipeline run $(date -u +%Y-%m-%dT%H:%MZ) [${{ steps.flow.outcome }}]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Run summary
        if: always()
        run: |
          {
            echo "### Prefect flow: ${{ steps.flow.outcome }}"
            echo '```'
            tail -n 5 prefect_runs.csv 2>/dev/null || echo "prefect_runs.csv not written"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if the flow failed
        if: steps.flow.outcome == 'failure'
        run: exit 1
