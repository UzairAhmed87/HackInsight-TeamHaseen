name: Hourly Data Pipeline

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - 'run_pipeline.py'
      - '.github/workflows/hourly-pipeline.yml'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git operations
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run data pipeline
        id: pipeline
        run: |
          echo "🚀 Starting hourly pipeline run..."
          python3 run_pipeline.py
          echo "✅ Pipeline completed"
        continue-on-error: true
      
      - name: Check pipeline status
        run: |
          if [ -f "data/quality/quality_report.json" ]; then
            echo "✅ Quality report generated"
            cat data/quality/quality_report.json | python3 -m json.tool | head -20
          else
            echo "⚠️ Quality report not found"
          fi
          
          if [ -f "prefect_runs.csv" ]; then
            echo "✅ Pipeline runs log exists"
            echo "📊 Last 5 runs:"
            tail -5 prefect_runs.csv
          else
            echo "⚠️ No pipeline runs log"
          fi
      
      - name: Commit pipeline results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          
          # Stage pipeline outputs
          git add prefect_runs.csv || true
          git add data/quality/quality_report.json || true
          git add data/reports/execution_status.json || true
          git add data/reports/forecast_metrics.json || true
          git add data/reports/forecast_predictions.csv || true
          git add data/processed/gold_air_quality.csv || true
          
          # Commit if changes exist
          if ! git diff --staged --quiet; then
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "⏰ Automated pipeline run: $TIMESTAMP"
            echo "✅ Changes committed"
          else
            echo "ℹ️ No changes to commit"
          fi
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
      
      - name: Pipeline Summary
        run: |
          echo "## 📊 Pipeline Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "prefect_runs.csv" ]; then
            echo "### Latest Runs" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -5 prefect_runs.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "data/quality/quality_report.json" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Quality Status" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat data/quality/quality_report.json | python3 -m json.tool | head -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Hourly pipeline execution complete" >> $GITHUB_STEP_SUMMARY
